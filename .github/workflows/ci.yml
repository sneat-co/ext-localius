name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    uses: sneat-co/cicd/.github/workflows/nx-ci.yml@main
    with:
      working-directory: frontend
      targets: "lint build"
      coverage-command: pnpm exec nx run ext-localius-contract:test --coverage
      coverage-path: coverage
      minimum-coverage: 100
      coverage-artifact-name: ext-localius-contract-coverage
